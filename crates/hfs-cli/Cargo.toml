[package]
name = "hfs-cli"
description = "Command-line interface for HousemanFS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "housemanfs"
path = "src/main.rs"

[dependencies]
hfs-core = { path = "../hfs-core" }
hfs-import = { path = "../hfs-import" }
hfs-index = { path = "../hfs-index" }
hfs-model = { path = "../hfs-model" }
hfs-tui = { path = "../hfs-tui" }
hfs-win = { path = "../hfs-win" }
# The versioned JSON export is the project's extension surface (D11): the one place where
# machine-readable output is a promise rather than a convenience. Kept to the CLI so no
# library crate carries a serialisation framework.
serde_json = "1.0"
